version: '3.8'

services:
  backend:
    build:
      context: ./backend/Chain-Sleuth-Backend
      dockerfile: Dockerfile
    container_name: chainsleuth-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/Chain-Sleuth-Backend/.env
    environment:
      - PORT=8000
    volumes:
      - ./backend/Chain-Sleuth-Backend/static/notices:/app/static/notices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
